name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build unsigned .app (无需签名证书)
        run: |
          xcodebuild -project ios/ChanTrading.xcodeproj \
            -target ChanTrading \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            CONFIGURATION_BUILD_DIR=build 2>&1 | tail -30

      - name: Package unsigned IPA
        run: |
          echo "--- workspace scan ---"
          find . -type d -name "*.app" -not -path "./build/*" || true
          APP=$(find . -type d -name "ChanTrading.app" -not -path "./build/*" | head -1)
          echo "APP path: $APP"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ChanTrading.ipa Payload
          ls -la ChanTrading.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChanTrading-ipa
          path: ChanTrading.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
